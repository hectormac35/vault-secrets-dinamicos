name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  lint:
    name: Scripts y Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck levantar.sh parar.sh scripts/*.sh
          shellcheck -s sh vault/bootstrap_vault.sh
      - name: docker compose config
        run: docker compose config --quiet

  e2e:
    name: Extremo a extremo (Vault + PostgreSQL reales)
    runs-on: ubuntu-latest
    needs: [tests, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar, escribir, revocar y comprobar la rotación
        run: ./scripts/prueba-e2e.sh
      - name: Logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Parar
        if: always()
        run: docker compose down -v
